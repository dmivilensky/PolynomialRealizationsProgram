name = "PolynomialRealizationsProgram"
defaultTargets = ["Verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "LeanCert"
git = "https://github.com/alerad/leancert.git"
rev = "b772f2c376b1103f444a71fe910b146c0bc9b002"

[[lean_lib]]
name = "chebyshev1"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "chebyshev2"
leanOptions = { autoImplicit = false, warningAsError = true }

[[lean_lib]]
name = "Verification"
srcDir = "Tools"
roots = ["Verification.All", "Verification.Audit"]
leanOptions = { autoImplicit = false, warningAsError = true }

